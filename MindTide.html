<!doctype html>
<!--
THESIS: MindTide is a personal field journal for active recall, not a competitive dashboard or a novelty skin.
OWN-WORLD: Coastal sand and sea glass by default; rainforest, deep-space, fossil-dig and alpine field marks share the same editorial journal system.
STORY: Choose a subject, collect observations as cards, then study freely or create a scored test.
FIRST VIEWPORT: A fixed journal spine holds subjects; an open paper workspace carries the selected habitat and its hand-drawn field study.
FORM: User-approved coastal default with four habitat extensions; direct subject-to-stack navigation and focused full-page study remain fixed.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f0ecdf">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob: https: http:; connect-src https://api.anthropic.com; base-uri 'none'; form-action 'none'">
<title>MindTide — Your study field journal</title>
<style>
:root{--paper:#faf8f0;--sand:#f0ecdf;--ink:#173e44;--muted:#597075;--teal:#17685f;--teal-dark:#105249;--wash:#e1eee7;--coral:#b9533c;--coral-wash:#f4e5da;--line:#d4d9cc;--white:#fffef9;--blue:#215d79;--danger:#a53d31;--nav-hover:#e4e5d9;--active-dot:#cbe7dc;--danger-border:#dba89b;--danger-wash:#fff8f2;--book-shadow:#e8e9dd;--book-art:#e4eee5;--book-art-alt:#f1e7db;--book-art-alt-ink:#965137;--stack-border:#c8d8ca;--field-border:#b8c8c2;--placeholder:#697d80;--error-wash:#fae9e0;--error-border:#e3b3a3;--notice-border:#c0d8ca;--warn-border:#e5cabb;--dialog-shadow:#173e4433;--dialog-backdrop:#183e4469;--card-border:#cfd8cd;--row-line:#e3e5dc;--choice-border:#9dbaac;--toast-shadow:#173e4426;--art-wash:#bdd5c9;--radius:12px;--ease:cubic-bezier(.16,1,.3,1);font:16px/1.55 "Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:var(--paper)}
:root[data-theme=rainforest]{--paper:#f5f7ec;--sand:#dfe8d2;--ink:#14382d;--muted:#526c5f;--teal:#1c6844;--teal-dark:#124d34;--wash:#d9ead9;--coral:#c05b37;--coral-wash:#f2dfd1;--line:#c8d3bf;--white:#fcfdf5;--blue:#17665f;--danger:#963f2f;--nav-hover:#cfddc5;--active-dot:#d8f0c7;--danger-border:#d5a28e;--danger-wash:#fff6ed;--book-shadow:#d8e1cb;--book-art:#d4e7c9;--book-art-alt:#e4ddbd;--book-art-alt-ink:#6c5f28;--stack-border:#b7cbb2;--field-border:#9fb9a8;--placeholder:#60786c;--error-wash:#f8e6dc;--error-border:#dcae9a;--notice-border:#b4cdb5;--warn-border:#dfc3aa;--dialog-shadow:#14382d38;--dialog-backdrop:#102f276b;--card-border:#bdcdb8;--row-line:#d8dfd0;--choice-border:#8fb49a;--toast-shadow:#14382d2b;--art-wash:#b8d3aa}
:root[data-theme=outerspace]{--paper:#090e1d;--sand:#11182e;--ink:#edf4ff;--muted:#aab9cf;--teal:#4f86e8;--teal-dark:#73a2ff;--wash:#172745;--coral:#c9f85a;--coral-wash:#26351f;--line:#34415e;--white:#111a30;--blue:#c9f85a;--danger:#ff9788;--nav-hover:#1a2541;--active-dot:#d9ff7c;--danger-border:#874f55;--danger-wash:#2c1821;--book-shadow:#050916;--book-art:#17294a;--book-art-alt:#26204a;--book-art-alt-ink:#d9ff7c;--stack-border:#3b5274;--field-border:#52647f;--placeholder:#91a2ba;--error-wash:#321b26;--error-border:#8f525a;--notice-border:#39547a;--warn-border:#60713b;--dialog-shadow:#00000070;--dialog-backdrop:#02040bcf;--card-border:#3b4968;--row-line:#283550;--choice-border:#557cc0;--toast-shadow:#00000080;--art-wash:#182b50}
:root[data-theme=desert]{--paper:#fff8e9;--sand:#ecd8b5;--ink:#4a3324;--muted:#74604e;--teal:#2a6e70;--teal-dark:#205759;--wash:#dce9df;--coral:#b9502f;--coral-wash:#f2ddca;--line:#d9c8aa;--white:#fffdf6;--blue:#2b687c;--danger:#9c3f31;--nav-hover:#dfcba8;--active-dot:#cce8df;--danger-border:#d6a18d;--danger-wash:#fff4e9;--book-shadow:#e2cba3;--book-art:#ead0a1;--book-art-alt:#d8e5d9;--book-art-alt-ink:#315d58;--stack-border:#c9b790;--field-border:#bfae8f;--placeholder:#786b5b;--error-wash:#f8e2d4;--error-border:#dda995;--notice-border:#b8d0c0;--warn-border:#dcbf9b;--dialog-shadow:#4a332438;--dialog-backdrop:#3c281d70;--card-border:#d4c19f;--row-line:#e4d7c0;--choice-border:#93b8ac;--toast-shadow:#4a33242b;--art-wash:#dfc193}
:root[data-theme=alpine]{--paper:#f4f7f3;--sand:#dce5e1;--ink:#183b38;--muted:#586f6b;--teal:#27665c;--teal-dark:#1d5048;--wash:#dbe9e4;--coral:#b95d32;--coral-wash:#f0dfd2;--line:#c8d5cf;--white:#fcfefa;--blue:#356d86;--danger:#984033;--nav-hover:#cedbd5;--active-dot:#d2ece2;--danger-border:#d3a18f;--danger-wash:#fff5ed;--book-shadow:#d4dfda;--book-art:#d6e4df;--book-art-alt:#dfe1cf;--book-art-alt-ink:#56602e;--stack-border:#b6cac1;--field-border:#9eb8ad;--placeholder:#60756f;--error-wash:#f5e3da;--error-border:#d9aa98;--notice-border:#b3cfc4;--warn-border:#ddc1a9;--dialog-shadow:#183b3838;--dialog-backdrop:#102f2b70;--card-border:#bdcec6;--row-line:#d7e0dc;--choice-border:#8db3a6;--toast-shadow:#183b382b;--art-wash:#b7d2c9}
:root[data-theme=outerspace] .nav-item.active,:root[data-theme=outerspace] .btn.primary{color:var(--paper)}

*{box-sizing:border-box}
body{margin:0;background:var(--paper)}
button,input,textarea,select{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--teal);text-underline-offset:4px}
button,a{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.025em}
h1{font-size:clamp(2rem,3.5vw,3rem)}
h2{font-size:1.9rem}
h3{font-size:1.12rem;font-weight:600}
p{max-width:70ch}
small,.small{font-size:.85rem}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.skip{position:fixed;top:-100px;left:20px;z-index:100;background:var(--ink);color:white;padding:12px}
.skip:focus{top:10px}
.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brand{display:flex;gap:10px;align-items:center;font-family:Georgia,serif;font-size:1.7rem;letter-spacing:-.05em;color:var(--ink);text-decoration:none}
.brand-mark{width:35px;height:35px}
.sidebar{position:fixed;inset:0 auto 0 0;width:246px;background:var(--sand);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:30px 21px 18px;z-index:10}
.sidebar .brand{padding:0 11px 28px}
.nav-item{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--ink);width:100%;padding:11px 12px;border-radius:7px;text-align:left;font-size:.93rem}
.nav-item:hover{background:var(--nav-hover)}
.nav-item.active{background:var(--teal);color:white}
.nav-subjects{margin-top:30px;overflow:auto;min-height:70px}
.nav-label{display:flex;align-items:center;justify-content:space-between;padding:0 12px 10px;font-size:.77rem;color:var(--muted);font-weight:600;letter-spacing:.055em}
.subject-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex:none}
.subject-dot.alternate{background:var(--coral)}
.nav-item.active .subject-dot{background:var(--active-dot)}
.nav-item .clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-footer{margin-top:auto;padding-top:22px}
.local-note{font-size:.74rem;color:var(--muted);margin:16px 12px 0;line-height:1.55}
.online-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-right:5px}
.main{margin-left:246px;min-height:100vh}
.topbar{height:76px;padding:0 44px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px;font-size:.83rem;color:var(--muted)}
.topbar .trail{display:flex;gap:9px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.topbar button{background:none;border:0;padding:4px;color:var(--ink);font-size:inherit}
.topbar .save-state{white-space:nowrap}
.page{max-width:1270px;padding:42px 48px 60px;margin:auto;animation:arrive .5s var(--ease)}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:32px}
.page-head p{margin-top:12px;color:var(--muted)}
.heading-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.heading-title .btn{flex:none}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:7px;padding:10px 17px;min-height:44px;background:var(--white);color:var(--ink);font-weight:600;font-size:.87rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background .18s,transform .18s,box-shadow .18s}
.btn:hover:not(:disabled){background:var(--sand);transform:translateY(-1px)}
.btn.primary{background:var(--teal);color:white;border-color:var(--teal)}
.btn.primary:hover:not(:disabled){background:var(--teal-dark)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover:not(:disabled){background:var(--sand);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger-border);background:var(--danger-wash)}
.btn.small{padding:6px 12px;min-height:36px;font-size:.8rem}
.icon-btn{border:0;background:transparent;padding:9px;border-radius:6px;display:inline-flex;color:var(--muted);min-width:38px;min-height:38px;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--sand);color:var(--ink)}
.welcome{position:relative;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding:4px 0 35px;margin-bottom:32px}
.welcome h1{font-size:clamp(2.7rem,4vw,3.8rem);max-width:510px}
.welcome h1 em{color:var(--teal);font-weight:400}
.welcome p{margin:20px 0 23px;max-width:43ch;color:var(--muted)}
.shore{width:100%;max-width:380px;justify-self:end;color:var(--teal);aspect-ratio:1.4}
.shore-scene{position:relative;width:100%;max-width:380px;justify-self:end;padding-bottom:38px}
.shore-scene .shore{display:block;max-width:none}
.shore-motion{position:absolute;right:0;bottom:0;min-width:44px;min-height:44px}
.shore-motion .icon-btn{min-width:44px;min-height:44px}
.shore-fish-route{animation:shore-swim 12s linear infinite paused}
.shore-fish-bob{animation:shore-bob 3s ease-in-out -.75s infinite paused}
.shore-fish-facing{transform-box:view-box;transform-origin:280px 188px;animation:shore-turn 12s linear infinite paused}
.shore-bubble{opacity:0;transform-box:fill-box;transform-origin:center;animation:shore-bubble 12s linear infinite paused}
.shore-bubble:nth-child(1){animation-delay:3s;--drift:-8px}
.shore-bubble:nth-child(2){animation-delay:3.35s;--drift:-5px}
.shore-bubble:nth-child(3){animation-delay:3.7s;--drift:-10px}
.shore-bubble:nth-child(4){animation-delay:9s;--drift:8px}
.shore-bubble:nth-child(5){animation-delay:9.35s;--drift:5px}
.shore-bubble:nth-child(6){animation-delay:9.7s;--drift:10px}
.shore-scene.is-animated .shore-fish-route,.shore-scene.is-animated .shore-fish-bob,.shore-scene.is-animated .shore-fish-facing,.shore-scene.is-animated .shore-bubble,.shore-scene.is-animated .frog-bob,.shore-scene.is-animated .rain-drop,.shore-scene.is-animated .ufo-float,.shore-scene.is-animated .space-star,.shore-scene.is-animated .dust-mote,.shore-scene.is-animated .brush-sweep,.shore-scene.is-animated .gecko-scuttle,.shore-scene.is-animated .goat-climb,.shore-scene.is-animated .snow-drift{animation-play-state:running}
.rainforest-art .frog-bob{transform-box:fill-box;transform-origin:center;animation:frog-breathe 3.8s ease-in-out infinite paused}
.rainforest-art .rain-drop{animation:rain-fall 4.5s linear infinite paused}
.rainforest-art .rain-drop:nth-child(2){animation-delay:-1.4s}
.rainforest-art .rain-drop:nth-child(3){animation-delay:-2.8s}
.space-art .ufo-float{transform-box:fill-box;transform-origin:center;animation:ufo-drift 5.5s ease-in-out infinite paused}
.space-art .space-star{transform-box:fill-box;transform-origin:center;animation:star-pulse 3s ease-in-out infinite paused}
.space-art .space-star:nth-child(2n){animation-delay:-1.5s}
.desert-art .dust-mote{animation:dust-drift 5s ease-in-out infinite paused}
.desert-art .dust-mote:nth-child(2n){animation-delay:-2.5s}
.desert-art .brush-sweep{transform-box:fill-box;transform-origin:70% 80%;animation:brush-dig 4.8s ease-in-out infinite paused}
.desert-art .gecko-scuttle{transform-box:fill-box;transform-origin:center;animation:gecko-breathe 4.4s ease-in-out infinite paused}
.alpine-art .goat-climb{transform-box:fill-box;transform-origin:center;animation:goat-step 4.2s ease-in-out infinite paused}
.alpine-art .snow-drift{animation:snow-fall 5.5s linear infinite paused}
.alpine-art .snow-drift:nth-child(2n){animation-delay:-2.75s}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:30px 0 22px}
.section-head h2{font-size:1.5rem}
.section-head p{font-size:.83rem;color:var(--muted)}
.subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:23px}
.subject-book{background:var(--white);border:1px solid var(--line);border-radius:4px 16px 16px 4px;box-shadow:3px 4px 0 var(--book-shadow);overflow:hidden;position:relative}
.book-art{height:108px;background:var(--book-art);position:relative;overflow:hidden;padding:18px 23px;color:var(--teal)}
.subject-book:nth-child(even) .book-art{background:var(--book-art-alt);color:var(--book-art-alt-ink)}
.book-art svg{position:absolute;width:230px;height:140px;right:-10px;top:-16px;opacity:.7}
.book-art .book-count{font-size:.77rem;position:relative;background:var(--white);padding:4px 9px;border-radius:4px;display:inline-block;color:var(--ink)}
.book-content{padding:22px}
.book-content h3{font-family:Georgia,serif;font-size:1.55rem;font-weight:400;margin-bottom:12px}
.book-meta{display:flex;gap:20px;font-size:.8rem;color:var(--muted);padding-bottom:22px}
.book-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:17px}
.field-note{margin-top:35px;display:flex;gap:14px;color:var(--muted);font-size:.85rem;align-items:flex-start}
.field-note .icon{color:var(--coral);margin-top:3px}
.empty{padding:45px 24px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);max-width:760px;margin:25px auto}
.empty h2{margin-bottom:12px}
.empty p{margin:0 auto 22px;color:var(--muted)}
.summary-line{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:.9rem;color:var(--muted);margin-top:16px}
.summary-line strong{color:var(--ink);font-weight:600}
.stack-list{border-top:1px solid var(--line)}
.stack-row{display:flex;align-items:center;gap:20px;padding:23px 2px;border-bottom:1px solid var(--line)}
.stack-glyph{width:48px;height:55px;flex:none;color:var(--teal);background:var(--wash);display:grid;place-items:center;border:1px solid var(--stack-border);border-radius:3px 8px 8px 3px;box-shadow:3px 3px 0 var(--sand)}
.stack-main{min-width:0;flex:1}
.stack-title{padding:0;background:none;border:0;text-align:left;color:var(--ink);font-family:Georgia,serif;font-size:1.35rem;overflow-wrap:anywhere}
.stack-main p{font-size:.81rem;color:var(--muted);margin-top:5px}
.searchbar{display:flex;align-items:center;gap:12px;margin:24px 0}
.searchbar label{position:relative;flex:1;max-width:410px}
.searchbar input{padding-left:42px}
.searchbar .icon{position:absolute;left:13px;top:14px}
.card-list{border-top:1px solid var(--line)}
.card-row{display:grid;grid-template-columns:1.15fr 1fr auto;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);align-items:start}
.card-row .card-question{font-weight:600;font-size:.94rem;overflow-wrap:anywhere}
.card-row .card-answer{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.card-type{display:inline-flex;align-items:center;gap:5px;font-size:.71rem;color:var(--teal);margin-top:9px}
.card-type.pearl{color:var(--book-art-alt-ink)}
.chip{font-size:.77rem;color:var(--teal);background:var(--wash);border-radius:4px;padding:4px 8px;display:inline-block}
.row-tools{display:flex;gap:3px}
.card-labels{display:grid;grid-template-columns:1.15fr 1fr 83px;gap:20px;font-size:.72rem;font-weight:600;color:var(--muted);padding:0 0 12px}
.editor{max-width:900px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.field{margin-bottom:22px}
.field>label,.label{display:block;font-size:.87rem;font-weight:600;margin-bottom:8px}
.help{font-size:.8rem;color:var(--muted);margin-top:7px;line-height:1.5}
.field input,.field textarea,.field select,input[type=search]{width:100%;border:1px solid var(--field-border);background:var(--white);color:var(--ink);border-radius:6px;padding:11px 13px;min-height:45px}
.field textarea{resize:vertical;min-height:138px;line-height:1.6}
.field textarea.compact{min-height:88px}
.field input::placeholder,.field textarea::placeholder,input[type=search]::placeholder{color:var(--placeholder);opacity:1}
.searchbar input[type=search]{padding-left:42px}
.field input[type=file]{font-size:.8rem;padding:9px}
.field input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--teal)}
.check-label{display:flex;align-items:center;gap:10px;font-size:.89rem;cursor:pointer}
.check-label input{accent-color:var(--teal);width:18px;height:18px}
.form-section{border-top:1px solid var(--line);padding-top:26px;margin-top:26px}
.form-section h2{font-size:1.45rem;margin-bottom:20px}
.preview{border:1px solid var(--line);background:var(--sand);padding:18px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.pearl-blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--coral);color:var(--coral);background:var(--coral-wash);border-radius:4px;padding:0 10px}
.media-preview{max-height:150px;max-width:100%;border-radius:5px;margin-top:10px;object-fit:contain}
.image-status{color:var(--danger);font-size:.8rem;display:block}
.editor-footer{display:flex;gap:12px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:24px;margin-top:30px}
.error{color:var(--danger);background:var(--error-wash);border:1px solid var(--error-border);border-radius:6px;padding:12px 15px;margin:15px 0;font-size:.86rem;white-space:pre-wrap;overflow-wrap:anywhere}
.error:empty{display:none}
.notice{background:var(--wash);border:1px solid var(--notice-border);border-radius:6px;padding:14px 17px;font-size:.86rem;margin:20px 0;color:var(--ink)}
.notice.warn{background:var(--coral-wash);border-color:var(--warn-border)}
.settings{max-width:790px}
.settings-section{padding:28px 0;border-top:1px solid var(--line)}
.settings-section h2{font-size:1.5rem;margin-bottom:13px}
.settings-section>p{font-size:.9rem;color:var(--muted);margin-bottom:20px}
.settings details{font-size:.85rem;margin-top:18px}
.settings summary{cursor:pointer;font-weight:600;margin-bottom:10px}
.settings details p{color:var(--muted);margin:10px 0}
.theme-picker{border:0;padding:0;margin:0;width:100%}
.theme-picker legend{font-size:.87rem;font-weight:600;margin-bottom:12px}
.theme-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.theme-option{position:relative;display:grid;grid-template-columns:104px 1fr;gap:15px;align-items:center;min-height:118px;padding:13px;border:1px solid var(--line);border-radius:8px;background:var(--white);cursor:pointer;transition:background .18s,transform .18s,box-shadow .18s,border-color .18s}
.theme-option:hover{background:var(--sand);transform:translateY(-1px)}
.theme-option:has(input:checked){border-color:var(--teal);box-shadow:3px 4px 0 var(--sand)}
.theme-option:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:4px}
.theme-option input{position:absolute;opacity:0;pointer-events:none}

  function generationShouldStop(error) {

  async function generateQuestions(prompts,{force=false,signal,onProgress}={}) {
    const errors=[];
    for(let levelIndex=0;levelIndex<C.generationLevels.length;levelIndex++){
      const level=C.generationLevels[levelIndex];
      try{
        await C.generate(library,prompts,level,{force,signal,onBatch:persistCache,onProgress:({done})=>onProgress?.({done:levelIndex*prompts.length+done,total:prompts.length*C.generationLevels.length,level})});

    return errors;
  }

  async function prepareTest() {

  async function previewCardImport(file) {
    if(!file||!cardImport)return;
    const token=++cardImportRead;

    renderCardImport();
    try {
      if(file.size>20*1024*1024)throw new Error('This card file is larger than 20 MB. Ask your AI agent to split it into smaller files.');
      const cards=C.validateCardImport(await file.text());
      if(token!==cardImportRead||route.page!=='card-import')return;
      cardImport.cards=cards;cardImport.loading=false;renderCardImport();$('#card-import-preview-title').focus({preventScroll:true});
    } catch(error) {
      if(token!==cardImportRead||route.page!=='card-import')return;
      cardImport.loading=false;renderCardImport();report(error);
    }

  function addImportedCards() {
    const pending=cardImport;
    if(!pending?.cards?.length||pending.loading)throw new Error('Choose a valid card file and preview it before adding cards.');
    let subjectId=pending.subjectId, stackId=pending.stackId;
    const subjectName=pending.subjectName.trim(), stackName=pending.stackName.trim();
    const newSubject=subjectId==='__new__', newStack=newSubject||stackId==='__new__';
    if(newSubject&&(!subjectName||subjectName.length>100))throw new Error('Enter a new subject name of 1 to 100 characters.');
    if(newStack&&(!stackName||stackName.length>100))throw new Error('Enter a new stack name of 1 to 100 characters.');
    commit(next=>{
      let subject=next.subjects.find(s=>s.id===subjectId);
      if(newSubject){subjectId=C.uid();subject={id:subjectId,name:subjectName,stacks:[],history:[]};next.subjects.push(subject);}
      if(!subject)throw new Error('Choose an existing subject or create a new one.');
      let stack=subject.stacks.find(st=>st.id===stackId);
      if(newStack){stackId=C.uid();stack={id:stackId,name:stackName,cards:[]};subject.stacks.push(stack);}
      if(!stack)throw new Error('Choose a stack in this subject or create a new one.');
      for(const content of pending.cards)stack.cards.push({id:C.uid(),...content,reviews:[]});
    });
    const count=pending.cards.length;
    testPlan=null;go({page:'stack',subjectId,stackId});notify(`${count} ${count===1?'card added':'cards added'}. Your existing cards are unchanged.`);
  }

      if(field.id==='generation-subject'){route.subjectId=field.value;route.stackId=undefined;renderShell();renderQuestionGeneration();}
      if(field.id==='generation-stack'){route.stackId=field.value||undefined;renderQuestionGeneration();}
      if(field.id==='test-subject'){route.subjectId=field.value;route.stackId=undefined;renderShell();renderTestSetup();}
      if(field.id==='test-scope'){route.stackId=field.value||undefined;renderTestSetup();}
      if(field.id==='test-level'){route.level=field.value;renderTestSetup();}
      if(field.id==='test-length'){route.requested=field.value;renderTestSetup();}
      if(field.matches('[data-test-answer]'))saveTestAnswer(Number(field.dataset.question),Number(field.value));
      if(field.name==='theme'){
        const previous=themeId();
        try{
          commit(next=>next.settings.theme=field.value);
          renderShell();renderSettings();
          notify(`${themeNames[field.value]} theme saved.`);
        }catch(error){
          applyTheme(previous);renderSettings();throw error;
        }
      }
      if(field.id==='import-file'){await importFile(field.files[0]);field.value='';}
      if(field.id==='stack-import-file'){const chosen=field.files[0];field.value='';await importSharedStack(chosen);}
      if(field.id==='card-import-file')await previewCardImport(field.files[0]);
      if(cardImport&&field.id==='card-import-subject'){cardImport.subjectId=field.value;cardImport.stackId='';renderCardImport();}
      if(cardImport&&field.id==='card-import-stack'){cardImport.stackId=field.value;renderCardImport();}
    }catch(error){report(error);if(field.id==='import-file')field.value='';}
  });
  document.addEventListener('error',event=>{if(event.target.matches?.('img[data-media]')){const msg=document.createElement('span');msg.className='image-status';msg.textContent='Image unavailable. Check the link or your connection.';event.target.replaceWith(msg);}},true);
  document.addEventListener('keydown',event=>{
    if(event.target.matches?.('.testing-tab')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){
      event.preventDefault();
      const tabs=[...event.target.closest('[role="tablist"]').querySelectorAll('[role="tab"]')],current=tabs.indexOf(event.target);
      const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(current+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
      tabs[next].click();
      return;
    }
    if($('#dialog').open||event.target.closest('input,textarea,select,[contenteditable],a,button')||event.repeat||event.ctrlKey||event.metaKey||event.altKey)return;
    if(study){if(event.code==='Space'){event.preventDefault();actions.reveal();}else if(study.revealed&&['1','2'].includes(event.key)){event.preventDefault();try{rate({1:'easy',2:'hard'}[event.key]);}catch(error){report(error);}}}
  });
  $('#dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
  for (const type of ['dragover','drop']) window.addEventListener(type,event=>{if(!event.target?.closest?.('#stack-drop'))event.preventDefault();});
  document.addEventListener('fullscreenchange',()=>{$('#study-fullscreen-error')?.replaceChildren();updateStudyFullscreen();});
  document.addEventListener('visibilitychange',updateShoreMotion);
  window.addEventListener('beforeunload',event=>{if(draft?.dirty||study||activeGeneration){event.preventDefault();event.returnValue='';}});
  window.addEventListener('storage',event=>{
    if(event.key===C.STORAGE_KEY||event.key===null)notify('Your journal changed in another tab. Export your work and reload before continuing to avoid overwriting changes.');
    if(event.key===C.API_KEY_STORAGE_KEY||event.key===null){
      if(route.page==='settings'&&!$('#api-key')?.value)renderSettings();
      notify('API key storage changed in another tab. Future requests use the current saved key.');
    }
  });
  try{library=C.load(emptyLibrary());expectedRecord=localStorage.getItem(C.STORAGE_KEY);applyTheme(library.settings.theme);}catch(error){startupError=error.message;}
  render();
  return {get version(){return APP_VERSION;},get library(){return library;},get route(){return route;}};
})();
</script>
</body>
</html>
